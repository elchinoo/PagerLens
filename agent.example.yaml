# pagerlens-agent configuration. Copy to agent.yaml (git-ignored) and edit.
# Secrets are never written here: token_env names an ENVIRONMENT VARIABLE that holds the secret.
#
#   export PAGERLENS_TOKEN=<an INGEST token created in PagerLens Settings>
#   export TRUSTDESK_METRICS=<a METRICS token created in TrustDesk Settings>
#   (and CITYPULSE_METRICS, CPSIM_METRICS, PAGERLENS_METRICS for the other targets below)
#   pagerlens-agent once agent.yaml --dry-run     # print what would be sent, send nothing
#   pagerlens-agent run  agent.yaml               # watch forever

pagerlens:
  url: https://your-pagerlens.example      # base URL of PagerLens
  token_env: PAGERLENS_TOKEN
interval_seconds: 30

targets:
  - name: trustdesk                        # becomes the service name in PagerLens
    tier: standard
    description: Security questionnaire knowledge base
    depends_on: []                         # services this one calls; lets PagerLens tell a victim from a cause
    probes:                                # black-box health checks from outside
      - url: https://your-trustdesk.example/healthz
        timeout: 10
    scrape:                                # Prometheus /metrics (TrustDesk, PagerLens and CityPulse share metric names)
      - url: https://your-trustdesk.example/metrics
        token_env: TRUSTDESK_METRICS
        mem_limit_mb: 512                  # optional: turns process memory into mem_pct
    alert:                                 # open an incident after this many failed checks in a row
      after_failures: 3
      name: ServiceDown
      severity: sev2

  # --- Watching a fleet database: query regressions -------------------------------------------------------
  # Every app built on agentpg-kit with the insights collector (Metrics.add_insights_collector) also exposes, on the same /metrics:
  #   db_insights_top_query_mean_seconds{app,queryid}   mean time of its slowest SQL statements (edb_stat_monitor, else pg_stat_statements)
  # The agent needs NO extra configuration for it: the scrape above already picks it up. For each statement it pushes one metric
  # point named slowq_<queryid> (mean in milliseconds; a negative query id is written slowq_m<digits>) for THIS target, and when a
  # statement's mean stays at least 3x its earlier median for 3 scrapes in a row it opens a SlowQuery alert (sev3). PagerLens then
  # investigates it: the `slow_queries` tool compares each slowq_* series with its baseline and the finding "slow_query" names the
  # query id with its mean before and after. Look the statement up on that app's Database page (Database insights) by queryid.
  #   Scrape every 30 s or faster: the detector needs 9 scrapes (6 of history, 3 slow) before it can alert.
  #   Minimal example for an app that exports the gauge:
  #   - name: shopfront
  #     depends_on: []
  #     scrape:
  #       - url: https://your-shopfront.example/metrics
  #         token_env: SHOPFRONT_METRICS     # a "metrics" token of that app

  # --- the rest of the family: CityPulse (the platform) and CityPulse Simulator (its field side) ---
  - name: citypulse-ingest
    tier: critical
    description: CityPulse ingest gateway
    probes:
      - url: https://your-citypulse.example/healthz
        timeout: 10
    scrape:
      - url: https://your-citypulse.example/metrics
        token_env: CITYPULSE_METRICS       # a "metrics" token created in CityPulse Settings
    alert: {after_failures: 3, name: ServiceDown, severity: sev1}

  - name: citypulse-simulator
    tier: standard
    description: CityPulse Simulator (field devices and edge gateway)
    depends_on: [citypulse-ingest]
    probes:
      - url: https://your-simulator.example/healthz
        timeout: 10
    scrape:
      - url: https://your-simulator.example/metrics
        token_env: CPSIM_METRICS           # the value of CPSIM_METRICS_TOKEN set on the simulator
    alert: {after_failures: 3, name: ServiceDown, severity: sev3}

  - name: pagerlens                         # PagerLens can watch itself; use a second PagerLens or accept that it cannot report its own outage
    tier: standard
    probes:
      - url: https://your-pagerlens.example/healthz
        timeout: 10
    scrape:
      - url: https://your-pagerlens.example/metrics
        token_env: PAGERLENS_METRICS
    alert: {after_failures: 3, name: ServiceDown, severity: sev3}

  # Experimental: needs the agentpg CLI logged in on this machine. Detects an auto-paused sandbox.
  # - name: trustdesk
  #   agentpg:
  #     - sandbox_id: sbx-0123456789ab
