[project]
name = "pagerlens"
version = "0.1.0"
description = "Incident-investigation agent on Postgres + pgvector, with a web UI and an MCP server."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "agentpg-kit>=0.2.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "mcp>=2.3",
  "cryptography>=43",
  "opentelemetry-proto>=1.27",
  "prometheus-client>=0.20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pagerlens = "pagerlens.cli:main"
pagerlens-agent = "pagerlens.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagerlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a Postgres with pgvector (DATABASE_URL)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# Local development: use the sibling checkout of the kit. Images install the published kit instead (see Dockerfile).
[tool.uv.sources]
agentpg-kit = { path = "../agentpg-kit", editable = true }
